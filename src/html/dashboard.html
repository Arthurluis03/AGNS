<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoControl</title>
    <link rel="stylesheet" href="/src/css/stye.css">
    <script src="/src/script/dashboard.js" defer></script>
</head>

<body>

    <aside class="sidebar">

        <div class="logo">
            <img src="../css/img/carV.png" alt="Carro" class="logo-icon">

            <div class="logo-text">
                <h1>A G N S</h1>
                <p>Controle de Entrada e Saída de Veículos</p>
            </div>
        </div>

        <nav class="menu">

            <a href="#" class="active">
                <img src="../css/img/homeV.png" alt="Início" class="icon">
                <span>Início</span>
            </a>

            <a href="#">
                <img src="../css/img/carV2.png" alt="Veículos" class="icon" id="veiculo_style">
                <span>Veículos</span>
            </a>

            <a href="#">
                <img src="../css/img/enterV.png" alt="Entradas" class="icon" id="entrada_style">
                <span>Entradas</span>
            </a>

            <a href="#">
                <img src="../css/img/sairV.png" alt="Saídas" class="icon">
                <span>Saídas</span>
            </a>

            <a href="#">
                <img src="../css/img/fileV.png" alt="Relatórios" class="icon">
                <span>Relatórios</span>
            </a>

            <a href="#">
                <img src="../css/img/settingV.png" alt="Configurações" class="icon">
                <span>Configurações</span>
            </a>

        </nav>

        <div class="profile-area">

            <div class="profile">
                <div class="profile-icon">
                    <img src="../css/img/userV.png" alt="Perfil" class="icon">
                </div>

                <div class="profile-info">
                    <strong>Administrador</strong>
                    <span>admin@autocontrol.com</span>
                </div>
            </div>

            <a href="#" class="logout">
                <img src="../css/img/logoutV.png" alt="Sair" class="icon">
                <span id="sair_button">Sair</span>
            </a>

        </div>

    </aside>

</body>
</html>
